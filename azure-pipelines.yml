
trigger: none
pool:
  name: Shashi-self-hosted-pool
stages:
  - stage: Terraform_init
    displayName: Terraform_Init_Stage
    jobs:
    - job: Terraform_init_Job
      displayName: 'Terraform Init'
      steps:
      - task: TerraformTask@5
        inputs:
          provider: 'azurerm'
          command: 'init'
          commandOptions: '-backend-config="storage_account_name=pipelinestorageb18g98" -backend-config="container_name=b18g98container" -backend-config="key=ADO-YAML.tfstate"'
          backendServiceArm: 'ADO-YAML-Backend'
          backendAzureRmStorageAccountName: 'pipelinestorageb18g98'
          backendAzureRmContainerName: 'b18g98container'
          backendAzureRmKey: 'ADO-YAML.tfstate'
